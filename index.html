  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">

  <!-- Firebase Web SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCEEFr5OacmCb-qMhE2m70xTfDzA6TMU9c",

      projectId: "fast-track-app-tt",

<body>
  <div id="auth-bar" style="padding: 12px; background: #1f2937; color: #ffffff; display: flex; justify-content: space-between; align-items: center; font-family: sans-serif;">
    <span id="user-display">Checking authentication...</span>
    <button id="auth-btn" onclick="toggleAuth()" style="padding: 6px 14px; background-color: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer;">Log In with Google</button>
  </div>

  <div id="app-container" style="display: none;">
    <!-- App UI rendered here -->
    <main style="padding: 20px; font-family: sans-serif;">
      <h1>Fast Track Dashboard</h1>
      <p>Your fasts are automatically synchronized with Cloud Firestore.</p>
      <button onclick="requestNotificationPermission()" style="padding: 8px 16px; background-color: #10b981; color: white; border: none; border-radius: 4px; cursor: pointer;">Enable Phone Notifications</button>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
