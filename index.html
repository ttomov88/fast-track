<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fast Track App</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">

  <!-- Firebase Web SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCEEFr5OacmCb-qMhE2m70xTfDzA6TMU9c",
      authDomain: "fast-track-app-tt.firebaseapp.com",
      projectId: "fast-track-app-tt",
      storageBucket: "fast-track-app-tt.firebasestorage.app",
      messagingSenderId: "368091780461",
      appId: "1:368091780461:web:2eb68c7d222a9b67fdf664"
    };

    firebase.initializeApp(firebaseConfig);
  </script>
</head>
<body>
  <!-- Header / Login Status Bar -->
  <header style="padding: 12px 20px; background: #1f2937; color: #ffffff; display: flex; justify-content: space-between; align-items: center; font-family: system-ui, sans-serif;">
    <span id="user-display">Checking login status...</span>
    <button id="auth-btn" onclick="toggleAuth()" style="padding: 8px 16px; background-color: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">Log In with Google</button>
  </header>

  <!-- Protected App Area -->
  <div id="app-container" style="display: none; padding: 20px; font-family: system-ui, sans-serif;">
    <h1>Fast Track Dashboard</h1>
    <p>Your fasting records automatically synchronize with Google Cloud Firestore across all devices.</p>
    
    <div style="margin-top: 20px;">
      <button onclick="requestNotificationPermission()" style="padding: 10px 18px; background-color: #10b981; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">Enable Phone Notifications</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
