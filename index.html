<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fast Track</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">

  <!-- Firebase Web SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCEEFr5OacmCb-qMhE2m70xTfDzA6TMU9c",
      authDomain: "fast-track-app-tt.firebaseapp.com",
      projectId: "fast-track-app-tt",
      storageBucket: "fast-track-app-tt.firebasestorage.app",
      messagingSenderId: "368091780461",
      appId: "1:368091780461:web:2eb68c7d222a9b67fdf664"
    };

    firebase.initializeApp(firebaseConfig);
  </script>
</head>
<body>
  <!-- Top Auth Banner -->
  <div id="auth-bar" style="padding: 10px 16px; background: #1e293b; color: #ffffff; display: flex; justify-content: space-between; align-items: center; font-family: system-ui, sans-serif; font-size: 14px;">
    <span id="user-display">Checking authentication...</span>
    <div>
      <button id="notify-btn" onclick="requestNotificationPermission()" style="display:none; padding: 6px 12px; margin-right: 8px; background-color: #059669; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">Enable Notifications</button>
      <button id="auth-btn" onclick="toggleAuth()" style="padding: 6px 12px; background-color: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">Log In with Google</button>
    </div>
  </div>

  <!-- Original Fast App Content -->
  <div id="app-content">
    <div class="container">
      <header>
        <h1>Fast Track</h1>
      </header>

      <section class="timer-section">
        <div class="timer-display">
          <span id="timer">00:00:00</span>
        </div>
        <div class="controls">
          <button id="startBtn">Start Fast</button>
          <button id="stopBtn" disabled>End Fast</button>
        </div>
      </section>

      <section class="history-section">
        <h2>Fast History</h2>
        <ul id="fastList"></ul>
      </section>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
